AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pubblicazione controllata delle grafiche Casalpoglio come Instagram Stories

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://my-goal-video-app-1.onrender.com
    Description: Origin Render completo, senza slash finale
  AssetsBucketName:
    Type: String
    Default: casalpoglio-social-assets
  InstagramConfigParameter:
    Type: String
    Default: /casalpoglio/instagram-publisher
  PublishingEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  ExpectedInstagramUsername:
    Type: String
    Default: polisportiva.casalpoglio
    Description: Username Instagram di destinazione, senza chiocciola

Resources:
  InstagramStoryPublisherExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: casalpoglio-instagram-publisher-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InstagramStoryPublisherRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/instagram-story-publisher:*
              - Sid: ReadInstagramConfiguration
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${InstagramConfigParameter}
              - Sid: ManagePrivateStoryStaging
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${AssetsBucketName}/instagram-stories/*

  InstagramStoryPublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: instagram-story-publisher
      CodeUri: ../lambda/instagram-story-publisher/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 330
      ReservedConcurrentExecutions: 2
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      Role: !GetAtt InstagramStoryPublisherExecutionRole.Arn
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          STAGING_BUCKET: !Ref AssetsBucketName
          INSTAGRAM_CONFIG_PARAMETER: !Ref InstagramConfigParameter
          META_GRAPH_API_VERSION: v25.0
          META_GRAPH_BASE_URL: https://graph.instagram.com
          PUBLISHING_ENABLED: !Ref PublishingEnabled
          EXPECTED_INSTAGRAM_USERNAME: !Ref ExpectedInstagramUsername
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [!Ref AllowedOrigin]
          AllowMethods: [POST]
          AllowHeaders:
            - content-type
            - x-publisher-pin
            - x-idempotency-key
          MaxAge: 300

  InstagramStoryPublisherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/instagram-story-publisher
      RetentionInDays: 3

Outputs:
  InstagramStoryPublisherUrl:
    Description: Inserire questo valore in VITE_INSTAGRAM_PUBLISH_URL su Render
    Value: !GetAtt InstagramStoryPublisherFunctionUrl.FunctionUrl
  PublishingState:
    Value: !Ref PublishingEnabled
