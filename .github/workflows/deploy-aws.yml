name: Deploy image generators

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lambda/goal-image/**'
      - 'lambda/lineup-image/**'
      - 'lambda/final-result-image/**'
      - 'lambda/shared/**'
      - 'lambda/package.json'
      - 'lambda/package-lock.json'
      - 'assets/**'
      - 'infra/template.yaml'
      - 'scripts/validate-assets.mjs'
      - '.github/workflows/deploy-aws.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22.17'
      - uses: aws-actions/setup-sam@v3
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Install and test Lambda package
        working-directory: lambda
        run: npm ci && npm test
      - name: Validate assets
        run: node scripts/validate-assets.mjs
      - name: Detect asset changes
        id: asset-changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- assets; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Synchronize versioned assets
        if: steps.asset-changes.outputs.changed == 'true'
        run: aws s3 sync assets/s3 "s3://${{ vars.ASSETS_BUCKET_NAME }}" --cache-control "public,max-age=86400"
      - name: Build SAM application
        run: sam build --template-file infra/template.yaml
      - name: Package Lambda bundle
        shell: bash
        run: |
          (cd .aws-sam/build/GoalImageFunction && zip -qr "$RUNNER_TEMP/goal-image.zip" .)
          (cd .aws-sam/build/LineupImageFunction && zip -qr "$RUNNER_TEMP/lineup-image.zip" .)
          (cd .aws-sam/build/FinalResultImageFunction && zip -qr "$RUNNER_TEMP/final-result-image.zip" .)
      - name: Upload Lambda bundles
        shell: bash
        run: |
          for function_name in goal-image lineup-image final-result-image; do
            aws s3 cp \
              "$RUNNER_TEMP/$function_name.zip" \
              "s3://${{ vars.ASSETS_BUCKET_NAME }}/sam-artifacts/image-generators/$function_name/current.zip"
          done
      - name: Update existing image generator Lambdas
        shell: bash
        run: |
          for function_name in goal-image lineup-image final-result-image; do
            aws lambda update-function-code \
              --function-name "$function_name" \
              --s3-bucket "${{ vars.ASSETS_BUCKET_NAME }}" \
              --s3-key "sam-artifacts/image-generators/$function_name/current.zip" \
              --publish >/dev/null
            aws lambda wait function-updated-v2 \
              --function-name "$function_name"
          done
