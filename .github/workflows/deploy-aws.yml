name: Deploy image generators

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lambda/goal-image/**'
      - 'lambda/lineup-image/**'
      - 'lambda/final-result-image/**'
      - 'lambda/shared/**'
      - 'lambda/package.json'
      - 'lambda/package-lock.json'
      - 'assets/**'
      - 'infra/template.yaml'
      - 'scripts/validate-assets.mjs'
      - '.github/workflows/deploy-aws.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22.17'
      - uses: aws-actions/setup-sam@v3
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Install and test Lambda package
        working-directory: lambda
        run: npm ci && npm test
      - name: Validate assets
        run: node scripts/validate-assets.mjs
      - name: Detect asset changes
        id: asset-changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- assets; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Synchronize versioned assets
        if: steps.asset-changes.outputs.changed == 'true'
        run: aws s3 sync assets/s3 "s3://${{ vars.ASSETS_BUCKET_NAME }}" --cache-control "public,max-age=86400"
      - name: Build SAM application
        run: sam build --template-file infra/template.yaml
      - name: Deploy versioned Lambda aliases and Function URLs
        # Reuse the application bucket and a dedicated prefix: the restricted OIDC role does not manage SAM bootstrap stacks.
        shell: bash
        run: |
          if sam deploy \
            --stack-name casalpoglio-image-generators \
            --region eu-west-1 \
            --s3-bucket "${{ vars.ASSETS_BUCKET_NAME }}" \
            --s3-prefix sam-artifacts/image-generators \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              AssetsBucketName="${{ vars.ASSETS_BUCKET_NAME }}" \
              AllowedOrigin="${{ vars.RENDER_ORIGIN }}"; then
            exit 0
          else
            deploy_status=$?
            echo "::group::CloudFormation deployment validation events"
            aws cloudformation describe-events \
              --stack-name casalpoglio-image-generators \
              --region eu-west-1 \
              --max-items 30 || true
            echo "::endgroup::"
            exit "$deploy_status"
          fi
